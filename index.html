    <script>
      (function () {
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var msg = String((e && e.reason && (e.reason.message || e.reason)) || '');
            if (
              msg.indexOf('WebSocket closed without opened') !== -1 ||
              msg.indexOf('[vite]') !== -1
            ) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );

        var OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          var PatchedWebSocket = function (url, protocols) {
            var protoStr = String(protocols || '');
            if (
              protoStr.indexOf('vite-hmr') !== -1 ||
              protoStr.indexOf('vite-ping') !== -1
            ) {
              var dummy = new EventTarget();
              dummy.url = String(url || '');
              dummy.readyState = 1;
              dummy.protocol = protoStr;
              dummy.extensions = '';
              dummy.bufferedAmount = 0;
              dummy.binaryType = 'blob';
              dummy.send = function () {};
              dummy.close = function () {
                dummy.readyState = 3;
              };
              return dummy;
            }
            return protocols !== undefined
              ? new OrigWebSocket(url, protocols)
              : new OrigWebSocket(url);
          };
          PatchedWebSocket.prototype = OrigWebSocket.prototype;
          PatchedWebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          PatchedWebSocket.OPEN = OrigWebSocket.OPEN;
          PatchedWebSocket.CLOSING = OrigWebSocket.CLOSING;
          PatchedWebSocket.CLOSED = OrigWebSocket.CLOSED;
          window.WebSocket = PatchedWebSocket;
        }
      })();
    </script>
